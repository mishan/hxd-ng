[package]
name = "hxd-push-uniqush"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hxd-core = { workspace = true }
# The payload, the keyed `msggroup`, the breaker, the VAPID key and
# `[push]` itself are the in-process sender's, so that a client cannot
# tell the two gateways apart (`docs/push-notifications.md` §4.1).
hxd-push-webpush = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
# One HTTP/1 exchange per call, over a TCP or a Unix socket this crate
# opens itself: uniqush is on this host or a network the operator
# controls, and needs no pool, no proxy and no TLS of ours.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
