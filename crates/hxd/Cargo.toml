[package]
name = "hxd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng: a Hotline server"
publish = false
default-run = "hxd"

[features]
# Voice chat. On by default so CI covers it; a server that doesn't want
# a WebRTC stack in its binary builds with --no-default-features.
default = ["voice", "inbox", "media", "markdown"]
voice = ["dep:hxd-voice"]
# The durable private-message inbox. On by default so CI covers it; a
# server that wants neither offline messages nor a bundled SQLite in its
# binary builds without it, and then an `[inbox]` config section is a
# startup error rather than a silently ignored promise.
inbox = ["dep:hxd-store-sqlite"]
# The inline-media pipeline. On by default so CI covers it; a server
# that wants no image decoder in its binary builds without it, and then
# a `[media]` config section is a startup error rather than a silently
# ignored promise.
media = ["dep:hxd-media"]
# Markdown news bodies: the parser that writes the plain-text downgrade
# and finds references (`docs/news.md` §5). On by default so CI covers
# it; without it `[news] markdown` defaults to "off", and asking for
# "render" is a startup error. "source" needs no parser.
markdown = ["dep:hxd-markdown"]

[[bin]]
name = "hxd"
path = "src/main.rs"

[dependencies]
hxd-core = { workspace = true }
hxd-auth-file = { workspace = true }
hxd-session = { workspace = true }
hxd-ng-session = { workspace = true }
hxd-media = { workspace = true, optional = true }
hxd-markdown = { workspace = true, optional = true }
hxd-voice = { workspace = true, optional = true }
hl-identity = { workspace = true }
base64 = "0.22"
hxd-store-sqlite = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
hxproto = { workspace = true }
# The media e2e stands real WebRTC clients up against the real SFU.
hxd-voice = { workspace = true }
# The inbox e2e uses the real store on a real file, not a fake.
hxd-store-sqlite = { workspace = true }
# The news e2e posts markdown through the real renderer.
hxd-markdown = { workspace = true }
# The media e2e uploads real images through the real pipeline, so it
# needs an encoder to make one with. Same pin as `hxd-media`'s.
hxd-media = { workspace = true }
image = { version = ">=0.25.5, <0.25.10", default-features = false, features = [
    "png",
] }
# The news e2e blocks an image the way a moderator will, by the hash of
# its canonical bytes in the store's own table. Same pins as
# `hxd-store-sqlite`'s.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
tempfile = "3"
