[package]
name = "hxd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng: a Hotline server"
publish = false
default-run = "hxd"

[features]
# Voice chat. On by default so CI covers it; a server that doesn't want
# a WebRTC stack in its binary builds with --no-default-features.
default = ["voice"]
voice = ["dep:hxd-voice"]

[[bin]]
name = "hxd"
path = "src/main.rs"

[dependencies]
hxd-core = { workspace = true }
hxd-auth-file = { workspace = true }
hxd-session = { workspace = true }
hxd-ng-session = { workspace = true }
hxd-voice = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
hotline-proto = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
tempfile = "3"
