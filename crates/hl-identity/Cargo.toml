[package]
name = "hl-identity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hotline identity objects: keys, device certificates, user cards, attestations, login proofs, signed and sealed messages"
publish = false

[dependencies]
# Ed25519 for identity and device signing keys. `rand_core` is deliberately
# off: seeds come from getrandom, so the crate has one source of randomness.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# X25519 for the device encryption key (E2E messaging uses it; this crate
# only carries it). `static_secrets` because the key persists.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = "0.10"
# HMAC for the enrollment pairing tag (identity-enrollment.md §4 `pair`).
# RustCrypto's, so it is the same SHA-256 as everything else here, and its
# `verify_slice` is a constant-time compare we would otherwise hand-roll.
hmac = "0.12"
getrandom = "0.2"
zeroize = "1"
# HPKE (RFC 9180) for sealed messages: DHKEM(X25519, HKDF-SHA256),
# HKDF-SHA256 and AES-256-GCM. 0.13 rather than 0.14 because it shares
# x25519-dalek, hkdf, aes-gcm and sha2 with what is already here, where
# 0.14 would bring a second major of each. It stays on 0.13 until
# x25519-dalek 3, hkdf 0.13, sha2 0.11 and aes-gcm 0.11 can move together.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
# The WHATWG serialization a login proof's `host` is compared in, which is
# what browsers and HTTP clients put in `Host`.
url = "2"

[dev-dependencies]
serde = { workspace = true }
serde_json = "1"
