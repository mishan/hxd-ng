[package]
name = "hxd-markdown"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng's markdown bodies: the plain-text downgrade and the references, never HTML"
publish = false

[dependencies]
hxd-core = { workspace = true }
# Default features off: `html` is pulldown-cmark's HTML writer, and a
# server whose promise is that it never renders HTML should not have one
# to call by mistake; `getopts` is its command-line tool's.
pulldown-cmark = { version = "0.13", default-features = false }
