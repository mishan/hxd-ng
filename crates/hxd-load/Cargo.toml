[package]
name = "hxd-load"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Load harness for hxd-ng: scenarios on both wires, with the server's invariants checked under load"
publish = false

[[bin]]
name = "hxd-load"
path = "src/main.rs"

[dependencies]
hxd-testclient = { workspace = true }
hxproto = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
# HDR histograms: p99.9 and max without keeping every sample.
hdrhistogram = { version = "7", default-features = false }

[dev-dependencies]
# The scenarios' own tests run them, small, against a real server in
# process, built from a config file as `hxd` builds one.
hxd = { path = "../hxd" }
hxd-session = { workspace = true }
hxd-ng-session = { workspace = true }
tempfile = "3"
