# S6: ng sessions dropping and resuming, classic guests coming and
# going, kicks. The accounts come from
#
#   hxd-load accounts <server's accounts dir> --prefix churn --count 50 \
#       --password <pw> --admin loadmod
#
# and the server needs `[ng] max_detached_per_addr` of at least
# `[churn] ng`, since every churner detaches from this one address.

[target]
legacy = "127.0.0.1:5500"
ng = "127.0.0.1:5700"
metrics = true
accounts = { prefix = "churn", count = 50, password = "change-me" }
admin = { login = "loadmod", password = "change-me" }

[run]
scenario = "churn"
duration = 60

[churn]
ng = 50
legacy = 50
cycle = 0.5
away = 0.2
chat_rate = 20
kick_every = 2.0
