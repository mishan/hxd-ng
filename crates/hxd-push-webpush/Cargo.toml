[package]
name = "hxd-push-webpush"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hxd-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = "1"
base64 = "0.22"
# P-256 for both halves of Web Push: ECDH against the subscription's key
# (RFC 8291) and ECDSA over the VAPID JWT (RFC 8292). Same RustCrypto
# generation as `sha2` and `hmac` elsewhere in the workspace, so there is
# one `digest` in the graph.
p256 = { version = "0.13", default-features = false, features = [
    "ecdh",
    "ecdsa",
    "pem",
    "std",
] }
hkdf = "0.12"
sha2 = "0.10"
hmac = { workspace = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand_core = { workspace = true }
# The HTTPS client: one hyper HTTP/1 connection per push, over a TLS
# stream this crate opens itself to an address it has already checked
# (`docs/webpush-gateway.md` §6). No connector, no pool, no resolver of
# anyone else's, and rustls because this process has no business
# linking an OpenSSL.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
webpki-roots = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
