[package]
name = "hxd-store-sqlite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng durable stores on SQLite: the private-message inbox"
publish = false

[dependencies]
hxd-core = { workspace = true }
# `bundled` compiles SQLite in: a build needs no libsqlite3-dev and cannot
# skew against whatever version the host happens to ship. See
# docs/private-messages.md §4 for why rusqlite rather than sqlx.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
