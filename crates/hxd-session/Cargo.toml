[package]
name = "hxd-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng session layer: framing, handshake, dispatch, wire trace"
publish = false

[dependencies]
hxproto = { workspace = true }
hxd-core = { workspace = true }
hxd-files = { workspace = true }
hxfiles-xfer = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
# TLS on the legacy ports. ring, as `hxd-push-webpush` already links it;
# 1.2 kept for clients whose TLS stack predates 1.3.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { workspace = true, features = ["rt", "macros"] }
