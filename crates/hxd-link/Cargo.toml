[package]
name = "hxd-link"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The link wire of fogWraith's Server Linking Extension: the 900-block, the hub, the key proof"
publish = false

[dependencies]
hxd-core = { workspace = true }
hxd-session = { workspace = true }
hxproto = { workspace = true }
hl-identity = { workspace = true }
# The key proof is Ed25519 over the TLS exporter (docs/server-link.md §7.3).
# curve25519-dalek for the canonical-encoding check on configured keys,
# which ed25519-dalek does not make on its own.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false }
sha2 = "0.10"
getrandom = "0.2"
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tracing = { workspace = true }
# The dialer's TLS client, in key mode verifying nothing about the
# certificate: the key proof authenticates the peer.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
# A test runs the per-hop wait on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
