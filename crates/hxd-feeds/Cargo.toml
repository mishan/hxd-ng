[package]
name = "hxd-feeds"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hxd-ng's feed reader: the checked fetch, the parse, and HTML to markdown"
publish = false

[dependencies]
sha2 = { workspace = true }
# RSS 0.9x–2.0, RDF, Atom and JSON Feed (MIT). Its XML reader is
# quick-xml's, which resolves the predefined and character references and
# leaves any other entity as written, so a DTD in a feed declares nothing
# that grows. The `sanitize` feature is off: ammonia would hand us HTML
# back, and the converter wants the feed's own.
feed-rs = { version = "3", default-features = false }
# A tokenizer, not a tree builder (MIT): the converter walks tokens with a
# bounded stack of its own, so a document nested a million deep costs a
# million tokens and no recursion. WHATWG tokenizing means entities and
# malformed markup are read the way a browser would read them.
html5gum = "0.8"
# Already in the graph through feed-rs; the links in a body are resolved
# with the same parser that read the feed.
url = "2"
# The fetch (`docs/news-feeds.md` §4).
hxd-fetch = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Reads what the converter wrote, to check it holds no HTML.
pulldown-cmark = { version = "0.13", default-features = false }
