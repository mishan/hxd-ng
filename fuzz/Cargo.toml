[package]
name = "hxd-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hxd-core = { path = "../crates/hxd-core" }
hxd-auth-file = { path = "../crates/hxd-auth-file" }
hxd-session = { path = "../crates/hxd-session" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "io-util"] }

# Its own workspace, so the root's builds and lints on stable never see it.
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false
