# hxd-ng CI: the same gates that run locally before anything is called
# done — fmt, clippy with warnings denied, the full test suite (unit,
# frame-level, and the e2e suites that drive scripted legacy and WebSocket
# clients against live servers on ephemeral ports), and a syntax check of
# the Node test client.
#
# The shared hxproto revision is fetched from hx-libs over https; advancing
# the pin is a deliberate act that this workflow then validates.
#
# TODO: add an MSRV (1.85) job once the lockfile is verified to resolve at
# that toolchain — the pin is inherited from gtkhx's Debian-stable floor
# but has only ever been exercised on newer rustc here.

name: CI

# `push` is scoped to main so a branch with an open PR is not built
# twice for the same commit — `pull_request` already covers every topic
# branch, and the push build of main is what says a merge landed green.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. Re-pushing a branch — which a stacked series
# does to every branch above the one that changed — leaves the earlier
# run building a commit nobody is waiting on any more. main is exempt:
# its build is the record that a merge landed green, so it finishes even
# when the next merge is already going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The optional stores are cfg'd out rather than stubbed, so a build
      # without them compiles different code — which has been broken by a
      # refactor that only the default build ever saw.
      - name: Clippy without default features
        run: cargo clippy -p hxd --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

  node-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the ng test client
        run: node --check tools/ng-client.mjs
