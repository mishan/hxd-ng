# The operator's image (Dockerfile, docker/): built on every pull
# request and started once by docker/smoke-test.sh, which checks that the
# legacy port answers the handshake and the ng port answers discovery.
# A push to main does the same and then publishes the image to GHCR as
# `latest` and `sha-<commit>`.
#
# Every pull request, not only those touching docker/: the image builds
# the whole workspace, so a change anywhere can break it.
#
# linux/amd64 only. An arm64 image would mean building the Rust workspace
# under QEMU, which takes far longer than everything else CI does.

name: Docker

on:
  push:
    branches: [main]
  pull_request:

# As in ci.yml: a re-pushed branch cancels its stale run, and main's
# runs finish, since each one is a publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR wants the repository in lower case; github.repository keeps
      # the owner's capitals.
      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Built into the local image store first, so the smoke test runs the
      # very image that is pushed; the push below reuses the layers. The
      # GHA cache keeps layers only, not the Dockerfile's cargo cache
      # mounts, so a tree that changed compiles from scratch.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: hxd-ng:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker/smoke-test.sh hxd-ng:smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
