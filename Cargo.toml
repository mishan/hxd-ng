# hxd-ng — a new Hotline server in Rust. See ROADMAP.md.
#
# Shared protocol crates are consumed from hx-libs at pinned git revisions.
# Bumping a pin is deliberate and gets a full workspace test run in both
# applications.

[workspace]
resolver = "2"
members = [
    "crates/hl-identity",
    "crates/hxd-core",
    "crates/hxd-files",
    "crates/hxd-media",
    "crates/hxd-markdown",
    "crates/hxd-auth-file",
    "crates/hxd-session",
    "crates/hxd-voice",
    "crates/hxd-ng-session",
    "crates/hxd-push-webpush",
    "crates/hxd-registrar",
    "crates/hxd-store-sqlite",
    "crates/hxd",
    "crates/hlid",
]
[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
# The shared crates must keep building at gtkhx's MSRV (its Debian-stable
# pin); hxd-ng itself simply matches it for now.
rust-version = "1.85"

[workspace.dependencies]
# Shared with GtkHx (see the note at the top of this file).
hxproto = { git = "https://github.com/mishan/hx-libs.git", rev = "7669d54a12fde12fd90503cfa2481cf977b7f95c" }
hxfiles-xfer = { git = "https://github.com/mishan/hx-libs.git", rev = "7669d54a12fde12fd90503cfa2481cf977b7f95c" }
hxhfs = { git = "https://github.com/mishan/hx-libs.git", rev = "7669d54a12fde12fd90503cfa2481cf977b7f95c" }

# Internal.
hl-identity = { path = "crates/hl-identity" }
hxd-core = { path = "crates/hxd-core" }
hxd-files = { path = "crates/hxd-files" }
hxd-auth-file = { path = "crates/hxd-auth-file" }
hxd-session = { path = "crates/hxd-session" }
hxd-ng-session = { path = "crates/hxd-ng-session" }
hxd-media = { path = "crates/hxd-media" }
hxd-markdown = { path = "crates/hxd-markdown" }
hxd-voice = { path = "crates/hxd-voice" }
hxd-push-webpush = { path = "crates/hxd-push-webpush" }
hxd-store-sqlite = { path = "crates/hxd-store-sqlite" }
hxd-registrar = { path = "crates/hxd-registrar" }

# External.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# Release, with line tables: what `perf record` and a flamegraph need to
# name a frame (`docs/metrics.md`). `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = 1
