# nginx in front of hxd-ng's ng port: TLS for the WebSocket protocol, the
# TRTP tunnel, and the HTTP routes beside them. The legacy port (5500),
# HTXF (5501) and voice media (5504/udp) do not go through here; publish
# them from the container directly. docs/docker.md walks through it.
#
# Assumes the container publishes the ng port on the host's loopback
# (`-p 127.0.0.1:5700:5700`). Docker forwards that port from the
# container's gateway, so the container needs
# HXD_NG_TRUSTED_PROXIES=127.0.0.1,::1,gateway, as docker/compose.yaml
# sets it. Drop this into /etc/nginx/conf.d/ and change hl.example and
# the certificate paths.

# A WebSocket asks for the upgrade; anything else gets an empty
# Connection header, which keeps the upstream connection in the
# keepalive pool where `close` would end it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream hxd_ng {
    server 127.0.0.1:5700;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hl.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hl.example;

    ssl_certificate     /etc/letsencrypt/live/hl.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hl.example/privkey.pem;

    # Image and news uploads. hxd enforces its own, smaller limits; this
    # only has to be above them.
    client_max_body_size 16m;

    location / {
        proxy_pass http://hxd_ng;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Discovery and the registrar answer per host.
        proxy_set_header Host $host;
        # hxd walks this from the right and takes the first address that
        # is not a trusted proxy, so appending is correct.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # hxd believes this header from a trusted proxy, so a copy the
        # client sent must never reach it. An empty value removes it. To
        # offer the mTLS binding instead, set it from the handshake as in
        # docs/hotline-ng-auth-rationale.md §6.1.
        proxy_set_header X-Hotline-Client-Cert "";

        # A WebSocket stays open as long as the session does; a detached
        # one resumes, but there is no reason to cut a live one every
        # minute.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # File downloads stream from hxd; don't spool them to disk first.
        proxy_buffering off;
    }
}
